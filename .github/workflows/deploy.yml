# Publica o build do Vite (dist/) no GitHub Pages a cada push na main.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source → "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - id: implantacao
        uses: actions/deploy-pages@v5
