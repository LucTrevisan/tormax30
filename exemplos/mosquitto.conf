# Mosquitto para o laboratório: TCP para o ESP32 e WebSocket para o navegador.
#   mosquitto -c mosquitto.conf -v
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Somente em rede de laboratório isolada. Em outras redes, crie usuários (mosquitto_passwd)
# e use password_file + allow_anonymous false.
allow_anonymous true

# Páginas em HTTPS (necessário para RV/RA fora do localhost) só aceitam wss://.
# Para isso, adicione certificado ao listener WebSocket:
# listener 8884
# protocol websockets
# certfile /caminho/fullchain.pem
# keyfile  /caminho/privkey.pem
